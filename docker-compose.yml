services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leaf_ai
      MYSQL_USER: leafapp
      MYSQL_PASSWORD: change_me_now
      MYSQL_ROOT_PASSWORD: change_root_now
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - leaf_uploads:/app/server/uploads
volumes:
  mysql_data:
  leaf_uploads:
